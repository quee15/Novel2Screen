<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novel2Screen Frontend Workspace</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-atmosphere" aria-hidden="true"></div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand-block">
          <div class="brand-mark">N2S</div>
          <div class="brand-copy">
            <p class="brand-kicker">Frontend Prototype</p>
            <h1>Novel2Screen</h1>
            <p>基于大语言模型的小说影视化创作平台前端原型</p>
          </div>
        </div>

        <div class="sidebar-project" id="sidebarProject"></div>
        <nav class="nav-list" id="navList" aria-label="工作区导航"></nav>

        <section class="sidebar-docs" aria-label="规范基线">
          <p class="sidebar-label">规范基线</p>
          <ul>
            <li><strong>requirement.md</strong><span>定义 MVP、流程与功能边界</span></li>
            <li><strong>schema_design.md</strong><span>约束 YAML 结构和校验规则</span></li>
            <li><strong>architecture.md</strong><span>规定模块分层、任务流与 API 边界</span></li>
            <li><strong>VUE3_MIGRATION.md</strong><span>说明静态原型如何迁移到 Vue3 + FastAPI</span></li>
          </ul>
        </section>
      </aside>

      <main class="main-stage">
        <header class="hero" id="hero"></header>
        <section class="section-body" id="sectionBody"></section>
      </main>
    </div>

    <div class="toast-stack" id="toastStack" aria-live="polite"></div>

    <script defer src="./data.js"></script>
    <script defer src="./yaml.js"></script>
    <script defer src="./app.js"></script>
  </body>
</html>
